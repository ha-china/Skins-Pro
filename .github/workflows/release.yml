name: Release

on:
  push:
    branches: [main, master]
    paths:
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build JS and release
    runs-on: ubuntu-latest
    if: github.repository == 'ha-china/Skins-Pro'

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Check release conditions
        id: check
        run: |
          NEW_VER=$(jq -r '.version' package.json)
          # Compare against the last released tag, not HEAD~1: a push may carry
          # several commits with the version bump anywhere among them.
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          OLD_VER=""
          if [ -n "$LAST_TAG" ]; then
            OLD_VER=$(git show "$LAST_TAG:package.json" 2>/dev/null | jq -r '.version' 2>/dev/null || echo "")
          fi
          VER_CHANGED=false
          if [ -n "$OLD_VER" ] && [ "$NEW_VER" != "$OLD_VER" ]; then
            VER_CHANGED=true
          elif [ -z "$OLD_VER" ]; then
            VER_CHANGED=true
          fi
          # Never re-release an already-tagged version (guards re-runs)
          if git rev-parse -q --verify "refs/tags/v$NEW_VER" >/dev/null 2>&1; then
            echo "v$NEW_VER is already tagged; skipping release."
            VER_CHANGED=false
          fi

          echo "version=$NEW_VER" >> "$GITHUB_OUTPUT"
          echo "version_changed=$VER_CHANGED" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        if: steps.check.outputs.version_changed == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        if: steps.check.outputs.version_changed == 'true'
        run: npm ci

      - name: Build JS bundle
        if: steps.check.outputs.version_changed == 'true'
        run: npm run build -- modern

      - name: Type check
        if: steps.check.outputs.version_changed == 'true'
        run: npm run type-check

      - name: Commit dist to master
        if: steps.check.outputs.version_changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -f dist/
          if ! git diff --staged --quiet; then
            git commit -m "chore: build dist assets [skip ci]"
          fi

      - name: Generate changelog
        if: steps.check.outputs.version_changed == 'true'
        id: changelog
        uses: Desmond-Dong/actions/bilingual-changelog@de3abcc903d2cbab5797cda0c0e48b06372107a2 # main
        with:
          llm-api-key: ${{ secrets.LLM_API_KEY }}
          llm-api-url: ${{ secrets.LLM_API_URL }}
          llm-model: ${{ secrets.LLM_MODEL }}

      - name: Tag version
        if: steps.check.outputs.version_changed == 'true'
        env:
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          # Tolerate a tag created by a concurrent run (rapid successive pushes)
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "Tag v$VERSION already exists; skipping"
          else
            git tag "v$VERSION"
          fi

      - name: Push master (including tags)
        if: steps.check.outputs.version_changed == 'true'
        run: |
          git push origin --tags
          git push

      - name: Create Release
        if: steps.check.outputs.version_changed == 'true'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: v${{ steps.check.outputs.version }}
          body: |
            ${{ steps.changelog.outputs.changelog }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
