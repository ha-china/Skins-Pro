version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      dev-dependencies:
        dependency-type: "development"
    # TypeScript 7 (native compiler) breaks @rollup/plugin-typescript; stay on
    # 5.x until the bundler plugin ecosystem catches up.
    # @types/node stays aligned with the Node version pinned in CI (24).
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
